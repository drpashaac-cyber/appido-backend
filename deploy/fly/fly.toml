# Fly.io — one built image, two process groups (api + worker). See deploy/README.md.
# Provision Postgres with `fly postgres create` (enable pgvector), Redis via Upstash, then
# `fly secrets set ...` for every secret below. `app` is your unique Fly app name.
app = "appido-backend"
primary_region = "fra"

[build]
  dockerfile = "services/core-api/Dockerfile"   # builds the whole monorepo (both dist/ are present)

[deploy]
  release_command = "npm run migrate"            # runs once per deploy, before the new version goes live

[env]
  NODE_ENV = "production"
  PORT = "8080"
  COOKIE_SECURE = "true"
  EMAIL_FROM = "APPIDO <no-reply@appido.io>"
  APPIDO_PAY_METHOD = "zarinpal"
  # All secrets (SECRETS_MASTER_KEY, DATABASE_URL, APP_DATABASE_URL, REDIS_URL, RESEND_API_KEY,
  # LITELLM_*, ANTHROPIC/OPENAI/GEMINI keys, APPIDO_PAY_SECRET, TRON/BSCSCAN/TON, OWNER_EMAIL,
  # PUBLIC_BASE_URL, COOKIE_DOMAIN, CORS_ORIGINS) are set with `fly secrets set`.

[processes]
  app = "node services/core-api/dist/main.js"
  worker = "node services/workers/dist/main.js"

[[services]]
  processes = ["app"]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "20s"
    method = "get"
    path = "/health"
