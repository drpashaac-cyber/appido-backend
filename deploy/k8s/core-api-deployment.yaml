apiVersion: apps/v1
kind: Deployment
metadata:
  name: appido-api
  namespace: appido
  labels: { app: appido-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: appido-api }
  template:
    metadata:
      labels: { app: appido-api }
    spec:
      containers:
        - name: core-api
          image: ghcr.io/your-org/appido-backend:latest   # default CMD runs core-api
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: appido-config }
            - secretRef: { name: appido-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: appido-api
  namespace: appido
spec:
  selector: { app: appido-api }
  ports:
    - port: 80
      targetPort: 8080
