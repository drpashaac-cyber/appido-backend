# Template — fill in, then: kubectl apply -f secret.example.yaml  (rename/keep out of git).
# SECRETS_MASTER_KEY must be >= 32 chars and IDENTICAL for api + workers (they share this Secret).
apiVersion: v1
kind: Secret
metadata:
  name: appido-secrets
  namespace: appido
type: Opaque
stringData:
  SECRETS_MASTER_KEY: "change-me-32-bytes-minimum-please"
  DATABASE_URL: "postgresql://appido:appido@<pg-host>:5432/appido"          # owner role (migrations)
  APP_DATABASE_URL: "postgresql://appido_app:appido_app@<pg-host>:5432/appido"  # NOBYPASSRLS runtime role
  REDIS_URL: "redis://<redis-host>:6379"
  OWNER_EMAIL: "appido.co@gmail.com"
  PUBLIC_BASE_URL: "https://api.appido.io"
  COOKIE_DOMAIN: ".appido.io"
  CORS_ORIGINS: "https://www.appido.io"
  RESEND_API_KEY: ""
  LITELLM_BASE_URL: ""
  LITELLM_MASTER_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  APPIDO_PAY_SECRET: ""
  TRON_API_KEY: ""
  BSCSCAN_API_KEY: ""
  TON_API_KEY: ""
